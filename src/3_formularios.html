<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>HTML Forms</title>
    <style>
        label{
        margin: 10px 0;
        display: inline-block;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <form name="register" method="post" action="register.php">
                <fieldset id="personalData">
                    <legend>Personal Info</legend>
                    <div id="divName">
                        <label for="name">Full Name: </label>
                        <input type="text" placeholder="Type in your Full Name" required id="name">
                    </div>
                    <div id="divEmail">
                        <label for="email">Email: </label>
                        <input type="email" placeholder="Type in your Email" required id="email">
                    </div>
                    <div id="divWhatsapp">
                        <label>WhatsApp: </label>
                        <input type="tel" placeholder="99-99999-9999" required pattern="[0-9]{2}-[0-9]{5}-[0-9]{4}">
                    </div>
                    <div id="divGender">
                        <label>Gender: </label>
                        <input type="radio" value="male" name="gender"><span>Male</span>
                        <input type="radio" value="female" name="gender"><span>Female</span>
                        <input type="radio" value="other" name="gender"><span>Other</span>
                    </div>
                    <div id="divInterest">
                        <label>Area of Interest: </label>
                        <input type="checkbox" name="interest" value="it"><span>Information Technology</span>
                        <input type="checkbox" name="interest" value="commerce"><span>Commerce</span>
                        <input type="checkbox" name="interest" value="finances"><span>Finances</span>
                    </div>
                    <div id="divCity">
                        <label for="city">City: </label>
                        <input type="text" placeholder="City:" required id="city">
                    </div>
                    <div id="divState">
                        <label>State: </label>
                        <select name="state">
                            <option value="Santa Catarina">SC</option>
                            <option value="Sao Paulo">SP</option>
                            <option value="Parana">PR</option>
                        </select>
                    </div>
                    <div id="divObservations">
                        <label>Observations: </label>
                        <textarea rows="3"></textarea>
                    </div>
                </fieldset>
                <fieldset id="legalEntity">
                    <legend>Legal Entity Info</legend>
                    <div id="divCompanyName">
                        <label for="companyName">Company Name: </label>
                        <input type="text" placeholder="Type in your Company Name" required id="companyName">
                    </div>
                    <div id="divTradeName">
                        <label for="tradeName">Trade Name: </label>
                        <input type="text" placeholder="Type in your Trade Name" required id="tradeName">
                    </div>
                    <div id="divCNPJ">
                        <label for="cnpj">CNPJ: </label>
                        <input type="text" placeholder="Type in your CNPJ" required id="cnpj">
                    </div>
                    <div id="divStateRegistry">
                        <label for="stateRegistry">State Registry: </label>
                        <input type="text" placeholder="Type in your State Registry" required id="stateRegistry">
                        <input type="checkbox" value="exempt"><span>Exempt from State Registry</span>
                    </div>
                </fieldset>
                <input type="submit" value="Register">
            </form>
        </section>
    </main>
</body>
</html>
