<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tables</title>
  <style>
    table, th, td{
      border: 1px solid #AAA;
    }
  </style>
</head>
<body>
  <main>
    <section>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Course</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>01</td>
            <td>John</td>
            <td>HTML</td>
            <td>Active</td>
          </tr>
          <tr>
            <td>02</td>
            <td>Mary</td>
            <td>CSS</td>
            <td>Inactive</td>
          </tr>
          <tr>
            <td>03</td>
            <td>Peter</td>
            <td>JS</td>
            <td>Active</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td colspan="2">FrontEnd Course</td>
            <td colspan="2">Pense Avanti</td>
          </tr>
        </tfoot>
      </table>
    </section>
  </main>
</body>
</html>
